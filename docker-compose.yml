services:
  mysql:
    image: mysql:8.0
    container_name: opt_plus_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: opt_plus_digital
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: opt_plus
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - opt_plus_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  opt_plus_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
